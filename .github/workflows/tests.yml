name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyflakes==3.2.0
      - run: python -m pyflakes src scripts dashboard tests
      # The committed data/hitoyoshi artifacts are what the suite tests against; no network calls.
      - run: python -m pytest -q
